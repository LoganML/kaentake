# FreedomStory: build on every push and publish it as a rolling release:
#   main -> "latest"  (tested; rebuild-server.bat installs it)
#   dev  -> "dev"     (for testing; test-dev.bat installs it)
name: freedomstory-build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: freedomstory-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: configure
      shell: bash
      run: cmake --preset release-win32 -DFREEDOMSTORY_BUILD="${GITHUB_SHA::7}"
    - name: build
      run: cmake --build --preset release-win32
    - name: publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -la build/Release
        if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=latest; else TAG=dev; fi
        gh release delete "$TAG" --yes --cleanup-tag || true
        gh release create "$TAG" build/Release/Kaentake.dll build/Release/Kaentake.exe build/Release/Custom.wz \
          --target "$GITHUB_SHA" --prerelease=$([ "$TAG" = dev ] && echo true || echo false) \
          --title "FreedomStory client build ${GITHUB_SHA::7} ($GITHUB_REF_NAME)" \
          --notes "Built automatically from ${GITHUB_SHA} on $GITHUB_REF_NAME."
